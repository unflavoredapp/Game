<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>getipa.fast</title>
    <meta name="description" content="Get IPAs fast — Decrypt Web jobs on getipa.fast" />
    <link rel="icon" href="/icon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/">
        <img src="/icon.jpg" alt="" width="32" height="32" />
        <span>getipa.fast</span>
      </a>
      <a class="top-link" href="#get">Get an IPA</a>
    </header>

    <main>
      <section class="hero">
        <div class="hero-bleed" aria-hidden="true">
          <img src="/icon.jpg" alt="" class="hero-bleed-img" />
          <div class="hero-bleed-shade"></div>
        </div>

        <div class="hero-copy">
          <h1 class="brand-hero">
            <span class="brand-line">getipa</span><span class="brand-dot">.</span
            ><span class="brand-fast">fast</span>
          </h1>
          <p class="lede">App Store link in. IPA out. Nodes do the rest.</p>
          <div class="cta-row">
            <a class="btn primary" href="#get">Get an IPA</a>
            <a class="btn ghost" href="/v0/health" target="_blank" rel="noreferrer">Health</a>
          </div>
        </div>
      </section>

      <section class="get" id="get">
        <div class="get-intro">
          <h2>Get an IPA</h2>
          <p class="section-lede">
            Queue a link on this relay. Demo node finishes jobs when no phone is attached.
          </p>
        </div>

        <form id="job-form" class="get-form" autocomplete="off">
          <label>
            <span>Operator token</span>
            <input
              id="operator-token"
              name="token"
              type="password"
              placeholder="OPERATOR_TOKEN"
              required
            />
          </label>
          <div class="row-url">
            <label class="grow">
              <span>App Store URL</span>
              <input
                id="app-url"
                name="url"
                type="url"
                placeholder="https://apps.apple.com/…/id…"
                required
              />
            </label>
            <label class="country">
              <span>CC</span>
              <input id="country" name="country" maxlength="2" value="us" required />
            </label>
          </div>
          <button class="btn primary wide" type="submit">Queue job</button>
        </form>
        <p id="form-status" class="status" role="status"></p>

        <div class="jobs-head">
          <h3>Jobs</h3>
          <button type="button" class="text-btn" id="refresh-jobs">Refresh</button>
        </div>
        <div id="jobs" class="jobs" aria-live="polite"></div>
      </section>
    </main>

    <footer class="foot">
      <span>getipa.fast</span>
      <span class="sep">·</span>
      <a href="/v0/health">/v0/health</a>
    </footer>

    <script src="/app.js" type="module"></script>
  </body>
</html>
