<VirtualHost *:80>
    ServerName delvek.bot
    ServerAlias www.delvek.bot
    RewriteEngine on
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName delvek.bot
    ServerAlias www.delvek.bot

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api/ http://127.0.0.1:3000/api/
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/
    ProxyPass /health http://127.0.0.1:3000/health
    ProxyPassReverse /health http://127.0.0.1:3000/health
    ProxyPass /panel.css http://127.0.0.1:3000/panel.css
    ProxyPassReverse /panel.css http://127.0.0.1:3000/panel.css
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    LimitRequestBody 0
    ProxyTimeout 1800

    ErrorLog ${APACHE_LOG_DIR}/delvek.bot-error.log
    CustomLog ${APACHE_LOG_DIR}/delvek.bot-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/delvek.bot/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/delvek.bot/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
