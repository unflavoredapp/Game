<VirtualHost *:80>
    ServerName delvek.bot
    ServerAlias www.delvek.bot
    RewriteEngine on
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName delvek.bot
    ServerAlias www.delvek.bot
    DocumentRoot /var/www/delvek.bot

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    ProxyPass /health http://127.0.0.1:8080/health
    ProxyPassReverse /health http://127.0.0.1:8080/health

    # Large IPA uploads
    LimitRequestBody 0
    ProxyTimeout 1800

    <Directory /var/www/delvek.bot>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/delvek.bot-error.log
    CustomLog ${APACHE_LOG_DIR}/delvek.bot-access.log combined

    # Certbot will manage these SSL lines if the site already has certificates.
    SSLCertificateFile /etc/letsencrypt/live/delvek.bot/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/delvek.bot/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
